<script>
  function showOnPageError(title, detail) {
    try {
      var existing = document.getElementById('__err_overlay__');

      var box = document.createElement('div');
      box.id = '__err_overlay__';
      box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;color:#b91c1c;padding:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;overflow:auto;';

      document.body.appendChild(box);
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showOnPageError('JS Error:', (e.message || '') + '\nFile: ' + (e.filename || '') + '\nLine: ' + (e.lineno || '') + ':' + (e.colno || '') + '\n\n' + (e.error && e.error.stack ? e.error.stack : ''));

  window.addEventListener('unhandledrejection', function (e) {

  });

// Cosmetic-only: turns a Firebase UID into a stable 6-digit "member number" for display (MT-xxxxxx)
function uidToMemberNumber(uid) {
  let hash = 0;
  for (let i = 0; i < uid.length; i++) {
    hash = (hash * 31 + uid.charCodeAt(i)) >>> 0;
  }
  return 100000 + (hash % 900000);
}

function LoginView({ onLoginSuccess }) {
    const [mode, setMode] = useState('login');
    const [name, setName] = useState('');
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [referCode, setReferCode] = useState('');
    const [error, setError] = useState('');
    const [notice, setNotice] = useState('');
    const [loading, setLoading] = useState(false);
    const createUserProfileDoc = async (uid, userName) => {
        const referralBonus = referCode.trim() ? 50 : 0;
        await setDoc(doc(db, 'users', uid), {
            userName,
            avatarUrl: DEFAULT_AVATAR,
            balance: 145 + referralBonus,
            completedTasks: 0,
            depositBalance: 500,
            referBalance: 0,
            isActivated: false,
            hasClaimedDaily: false,
            hasSubmittedGmail: false,
            hasSubmittedInstagram: false,
            hasClaimedReferral: false,
            taskStatus: {},
            adTaskStatus: {},
            referredBy: referCode.trim() || null,
            createdAt: serverTimestamp(),
        });
    };
    const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setNotice('');
        if (!email || !password) {
            setError('Please fill in all required fields');
            return;
        }
        if (mode === 'signup' && !name) {
            setError('Please provide your full name');
            return;
        }
        if (password.length < 6) {
            setError('Password should be at least 6 characters');
            return;
        }
        setLoading(true);
        try {
            if (mode === 'signup') {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: name });
                await createUserProfileDoc(cred.user.uid, name);
            }
            else {
                await signInWithEmailAndPassword(auth, email, password);
            }
            onLoginSuccess();
