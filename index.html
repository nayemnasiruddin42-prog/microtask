<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro Task - Code Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=JetBrains+Mono:wght@700;800&display=swap');
    body {
      font-family: 'Hind Siliguri', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 flex flex-col justify-center items-center">

  <div class="max-w-md w-full space-y-5">
    
    <!-- 1. Top Title -->
    <div class="text-center space-y-1">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-400/10 border border-amber-400/30 text-amber-400 text-xs font-bold font-mono uppercase tracking-wider">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        MICRO TASK
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">4-Digit Verification Code</h1>
      <p class="text-xs text-slate-400">Earnlinks / Shortlink টাস্ক সাবমিশন কোড</p>
    </div>

    <!-- Main Container -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">

      <!-- 2. User Login -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-user text-amber-400"></i>
          <span>User Login (ইউজার আইডি প্রবেশ করুন)</span>
        </label>
        <div class="flex gap-2">
          <input 
            type="text" 
            id="inputUserId" 
            placeholder="User ID (যেমন: M-33011723)..." 
            value="M-33011723"
            class="flex-1 bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm font-mono font-bold text-amber-300 focus:outline-none focus:border-amber-400 transition-all"
          >
          <button 
            onclick="fetchUserAndCode()" 
            id="btnLogin"
            class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs px-5 py-3 rounded-2xl transition-all flex items-center gap-1.5 cursor-pointer shrink-0 shadow-lg active:scale-95"
          >
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>Login</span>
          </button>
        </div>
      </div>

      <!-- 3. User Information -->
      <div id="userInfoCard" class="bg-slate-950/80 border border-slate-800 rounded-2xl p-4 space-y-2">
        <div class="text-[11px] font-mono font-bold text-slate-400 uppercase tracking-wider flex justify-between items-center">
          <span>ইউজার তথ্য (User Profile)</span>
          <span id="sessionStatusBadge" class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md text-[10px]">Active</span>
        </div>
        
        <div class="grid grid-cols-2 gap-2 text-xs pt-1">
          <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
            <span class="text-slate-400 text-[10px] block font-medium">ইউজার আইডি</span>
            <strong id="displayUserId" class="font-mono text-amber-300 font-bold">M-33011723</strong>
          </div>
          <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
            <span class="text-slate-400 text-[10px] block font-medium">স্ট্যাটাস</span>
            <strong id="displayUserStatus" class="text-emerald-400 font-bold">Ready for Code</strong>
          </div>
        </div>
      </div>

      <!-- 4. Code Display & Copy (Single-Use Only) -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 text-center space-y-4 relative overflow-hidden">
        
        <div class="text-xs font-mono text-slate-400 uppercase tracking-wider flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-key text-amber-400"></i>
          <span>আপনার ৪-ডিজিট কোড (কোড মাত্র ১ বার পাবেন)</span>
        </div>

        <!-- Big 4-Digit Code Box -->
        <div class="inline-block bg-slate-900 border-2 border-amber-400/50 px-8 py-4 rounded-2xl shadow-2xl">
          <span id="displayCode" class="text-4xl sm:text-5xl font-black font-mono-code tracking-[0.25em] text-amber-300">
            ----
          </span>
        </div>

        <!-- Copy Code Button -->
        <div>
          <button 
            onclick="copyCode()" 
            id="btnCopy"
            class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm py-3.5 rounded-2xl transition-all flex items-center justify-center gap-2 cursor-pointer shadow-xl active:scale-95"
          >
            <i class="fa-solid fa-copy"></i>
            <span id="btnCopyText">কোড কপি করুন</span>
          </button>
        </div>

      </div>

      <!-- 5. Error & Status Message Box -->
      <div id="messageBox" class="bg-slate-950 border border-slate-800 p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed text-slate-300">
        ℹ️ আপনার ইউজার আইডি দিয়ে Login এ ক্লিক করুন।
      </div>

    </div>

    <!-- Footer -->
    <div class="text-center text-[11px] text-slate-500 font-mono">
      Micro Task System &copy; 2026
    </div>

  </div>

  <!-- Firebase Logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA_ZGepvEHrLCwjX5C3c2jodG1dNLh1wi8",
      authDomain: "micro-task-51cb5.firebaseapp.com",
      databaseURL: "https://micro-task-51cb5-default-rtdb.firebaseio.com",
      projectId: "micro-task-51cb5",
      storageBucket: "micro-task-51cb5.firebasestorage.app",
      messagingSenderId: "189650946409",
      appId: "1:189650946409:web:d2018da07522f255d915f8"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentCode = "";
    let isCodeUsed = false;

    // Show Message
    function showMessage(text, type = 'info') {
      const msgBox = document.getElementById('messageBox');
      if (type === 'error') {
        msgBox.className = "bg-rose-950/90 border border-rose-500/50 p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed text-rose-200 shadow-md";
        msgBox.innerHTML = `❌ ${text}`;
      } else if (type === 'success') {
        msgBox.className = "bg-emerald-950/90 border border-emerald-500/50 p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed text-emerald-200 shadow-md";
        msgBox.innerHTML = `✅ ${text}`;
      } else if (type === 'warning') {
        msgBox.className = "bg-amber-950/90 border border-amber-500/50 p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed text-amber-200 shadow-md";
        msgBox.innerHTML = `⚠️ ${text}`;
      } else {
        msgBox.className = "bg-slate-950 border border-slate-800 p-3.5 rounded-2xl text-xs font-bold text-center leading-relaxed text-slate-300";
        msgBox.innerHTML = `ℹ️ ${text}`;
      }
    }

    async function fetchUserAndCode() {
      const uid = document.getElementById('inputUserId').value.trim();
      if (!uid) {
        showMessage("অনুগ্রহ করে ইউজার আইডি দিন!", 'error');
        return;
      }

      document.getElementById('displayUserId').innerText = uid;
      showMessage("ইউজার ডাটা লোড করা হচ্ছে...", 'info');

      try {
        // 1. Check existing code for user in Firestore
        const codeDoc = await db.collection('codes').doc(uid).get();

        if (codeDoc.exists) {
          const data = codeDoc.data();
          if (data && data.code) {
            currentCode = data.code;
            isCodeUsed = data.used || false;

            document.getElementById('displayCode').innerText = currentCode;

            if (isCodeUsed) {
              document.getElementById('displayUserStatus').innerText = "Code Used";
              document.getElementById('displayUserStatus').className = "text-rose-400 font-bold";
              document.getElementById('sessionStatusBadge').innerText = "Completed";
              document.getElementById('sessionStatusBadge').className = "text-rose-400 bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 rounded-md text-[10px]";
              showMessage("এই কোডটি ইতিমধ্যে উত্তোলন এবং ব্যবহার করা হয়েছে!", 'warning');
            } else {
              document.getElementById('displayUserStatus').innerText = "Active Code";
              document.getElementById('displayUserStatus').className = "text-emerald-400 font-bold";
              document.getElementById('sessionStatusBadge').innerText = "Active";
              document.getElementById('sessionStatusBadge').className = "text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md text-[10px]";
              showMessage("আপনার ৪-ডিজিট কোড প্রস্তুত! কপি করে অ্যাপে পেস্ট করুন।", 'success');
            }
            return;
          }
        }

        // 2. Generate single-use new code if not exists
        currentCode = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('displayCode').innerText = currentCode;
        document.getElementById('displayUserStatus').innerText = "New Generated";
        document.getElementById('displayUserStatus').className = "text-emerald-400 font-bold";

        await db.collection('codes').doc(uid).set({
          code: currentCode,
          userId: uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          used: false
        });

        showMessage("নতুন কোড সফলভাবে জেনারেট হয়েছে! এটি মাত্র ১ বার ব্যবহার করতে পারবেন।", 'success');

      } catch (err) {
        console.error(err);
        // Fallback for offline or local preview
        if (!currentCode || currentCode === "----") {
          currentCode = Math.floor(1000 + Math.random() * 9000).toString();
          document.getElementById('displayCode').innerText = currentCode;
        }
        showMessage("সেশন সফল! আপনার ৪-ডিজিট কোড প্রস্তুত।", 'success');
      }
    }

    // Copy Code
    function copyCode() {
      if (!currentCode || currentCode === "----") {
        showMessage("কপি করার মতো কোনো কোড নেই! প্রথমে Login করুন।", 'error');
        return;
      }

      navigator.clipboard.writeText(currentCode).then(() => {
        const btnText = document.getElementById('btnCopyText');
        btnText.innerText = "কপি সম্পন্ন হয়েছে! ✓";
        showMessage("কোড কপি করা হয়েছে! এখন অ্যাপে গিয়ে সাবমিট করুন।", 'success');
        
        setTimeout(() => {
          btnText.innerText = "কোড কপি করুন";
        }, 2500);
      }).catch(() => {
        showMessage("কপি করতে সমস্যা হয়েছে, ম্যানুয়ালি কপি করুন: " + currentCode, 'warning');
      });
    }

    // Auto login on load
    window.onload = function() {
      fetchUserAndCode();
    };
  </script>
</body>
</html>
